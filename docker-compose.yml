services:
  # ============================================================
  # BASE DE DONNÉES POSTGRESQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: ifppo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ifppo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # APPLICATION SPRING BOOT
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ifppo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # On force les valeurs depuis le .env (déjà chargé par env_file)
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport -Djava.net.preferIPv4Stack=true"
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - ifppo-network

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
    driver: local

# ============================================================
# RÉSEAUX
# ============================================================
networks:
  ifppo-network:
    driver: bridge