
# ============================================================
# APPLICATION - PROFIL DOCKER
# ============================================================

spring.application.name=Web_Platform
spring.config.import=optional:file:.env

# ============================================================
# SERVEUR
# ============================================================
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# ============================================================
# BASE DE DONNÉES
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# GESTION DES FICHIERS
# ============================================================
app.upload.dir=/app/uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ============================================================
# CAMPAY
# ============================================================
campay.base-url=${CAMPAY_BASE_URL}
campay.username=${CAMPAY_USERNAME}
campay.password=${CAMPAY_PASSWORD}

# ============================================================
# CLOUDINARY
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================================
# SPRING SECURITY
# ============================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# ============================================================
# PERFORMANCE
# ============================================================
server.compression.enabled=true
server.compression.min-response-size=1024

spring.web.resources.cache.period=365d
spring.web.resources.cache.use-last-modified=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
#
spring.thymeleaf.cache=true
spring.thymeleaf.enable-spring-el-compiler=true
#spring.thymeleaf.prefix=classpath:/templates/
#spring.thymeleaf.suffix=.html
#spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8


# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.ifppo=DEBUG
logging.level.org.springframework.web=WARN