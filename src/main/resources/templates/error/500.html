<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur interne - IFFPO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8edf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .error-container {
            max-width: 650px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 55px 45px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Bande décorative en haut */
        .error-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #dc2626, #ef4444, #dc2626);
            background-size: 200% 100%;
            animation: gradientMove 3s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
        }

        /* Éléments décoratifs en arrière-plan */
        .error-container::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.03) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ============================================================
           ICÔNE SVG
           ============================================================ */
        .error-icon-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .error-icon-bg {
            width: 110px;
            height: 110px;
            background: #fef2f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .error-icon-bg svg {
            width: 55px;
            height: 55px;
        }

        /* Petite icône d'alerte en haut à droite */
        .error-alert-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 32px;
            height: 32px;
            background: #dc2626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
            animation: pulseBadge 2s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .error-alert-badge svg {
            width: 16px;
            height: 16px;
        }

        /* ============================================================
           TEXTE
           ============================================================ */
        .error-title {
            font-size: 28px;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .error-title span {
            color: #dc2626;
        }

        .error-subtitle {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 10px;
            line-height: 1.7;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ============================================================
           MESSAGE D'ERREUR
           ============================================================ */
        .error-message-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 18px 22px;
            margin: 20px 0 30px;
            border-left: 4px solid #dc2626;
            text-align: left;
            position: relative;
        }

        .error-message-box p {
            color: #334155;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .error-message-box .highlight {
            color: #dc2626;
            font-weight: 600;
        }

        .error-message-box .error-icon-inline {
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        .error-message-box .error-icon-inline svg {
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }

        /* ============================================================
           BOUTONS
           ============================================================ */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1a3c6e, #2d6a9f);
            color: white;
            box-shadow: 0 4px 20px rgba(26, 60, 110, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(26, 60, 110, 0.4);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
        }

        .btn-outline {
            background: transparent;
            color: #1a3c6e;
            border: 2px solid #1a3c6e;
        }

        .btn-outline:hover {
            background: #1a3c6e;
            color: white;
            transform: translateY(-3px);
        }

        .btn-outline svg {
            width: 18px;
            height: 18px;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-3px);
        }

        .btn-secondary svg {
            width: 18px;
            height: 18px;
        }

        /* ============================================================
           LIENS UTILES
           ============================================================ */
        .helpful-links {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 2px solid #f1f5f9;
            width: 100%;
        }

        .helpful-links-title {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .helpful-links-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .helpful-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #2d6a9f;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .helpful-link:hover {
            color: #1a3c6e;
            transform: translateX(3px);
        }

        .helpful-link svg {
            width: 14px;
            height: 14px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .error-container {
                padding: 40px 25px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-icon-bg {
                width: 85px;
                height: 85px;
            }

            .error-icon-bg svg {
                width: 42px;
                height: 42px;
            }

            .error-alert-badge {
                width: 26px;
                height: 26px;
            }

            .error-alert-badge svg {
                width: 13px;
                height: 13px;
            }

            .btn-group {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 12px 20px;
                font-size: 14px;
            }

            .error-message-box {
                padding: 14px 16px;
            }

            .error-message-box p {
                font-size: 13px;
            }

            .helpful-links-grid {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .error-subtitle {
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .error-container {
                padding: 30px 18px;
            }

            .error-title {
                font-size: 19px;
            }

            .error-icon-bg {
                width: 70px;
                height: 70px;
            }

            .error-icon-bg svg {
                width: 35px;
                height: 35px;
            }

            .error-alert-badge {
                width: 22px;
                height: 22px;
            }

            .error-alert-badge svg {
                width: 11px;
                height: 11px;
            }

            .error-subtitle {
                font-size: 13px;
            }

            .error-message-box p {
                font-size: 12px;
            }
        }

        /* ============================================================
           RÉDUCTION DE MOUVEMENT
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            .error-container::before {
                animation: none;
            }

            .error-icon-bg {
                animation: none;
            }

            .error-alert-badge {
                animation: none;
            }

            .btn {
                transition: none;
            }

            .helpful-link {
                transition: none;
            }
        }
    </style>
</head>
<body>

<div class="error-container">

    <!-- ============================================================
         ICÔNE SVG
         ============================================================ -->
    <div class="error-icon-wrapper">
        <div class="error-icon-bg">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="#dc2626" stroke-width="1.8"/>
                <path d="M12 8V12" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="16" r="0.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
                <path d="M12 4L12 6" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
                <path d="M20 12H18" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
                <path d="M6 12H4" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
                <path d="M19.07 4.93L17.66 6.34" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M6.34 17.66L4.93 19.07" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="error-alert-badge">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 9V14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="12" cy="18" r="0.5" fill="white" stroke="white" stroke-width="2"/>
            </svg>
        </div>
    </div>

    <!-- ============================================================
         TITRE
         ============================================================ -->
    <h1 class="error-title">
        Erreur <span>interne</span>
    </h1>

    <p class="error-subtitle">
        Nous rencontrons un problème technique. Notre équipe a été informée et travaille sur la résolution.
    </p>

    <!-- ============================================================
         MESSAGE D'ERREUR
         ============================================================ -->
    <div class="error-message-box">
        <p>
            <span class="error-icon-inline">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="#dc2626" stroke-width="1.5"/>
                    <path d="M12 8V12" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="16" r="0.5" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
                </svg>
            </span>
            <span class="highlight">Erreur 500</span> — Le serveur a rencontré une situation inattendue.
            Veuillez <span class="highlight">réessayer</span> dans quelques instants.
        </p>
    </div>

    <!-- ============================================================
         BOUTONS
         ============================================================ -->
    <div class="btn-group">
        <a href="/" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 12L12 4L21 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 10V20H19V10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="9" y="14" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/>
            </svg>
            Accueil
        </a>
        <a href="javascript:history.back()" class="btn btn-outline">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 5L5 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Retour
        </a>
        <button onclick="location.reload()" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M21 3V9H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 12C3 16.97 7.03 21 12 21C16.97 21 21 16.97 21 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M21 9C21 12.87 17.87 16 14 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Réessayer
        </button>
    </div>

    <!-- ============================================================
         LIENS UTILES
         ============================================================ -->
    <div class="helpful-links">
        <div class="helpful-links-title">Liens utiles</div>
        <div class="helpful-links-grid">
            <a href="/contact" class="helpful-link">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M4 6.5C4 5.4 4.9 4.5 6 4.5H18C19.1 4.5 20 5.4 20 6.5V15.5C20 16.6 19.1 17.5 18 17.5H12L8 20V17.5H6C4.9 17.5 4 16.6 4 15.5V6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M8 9H16M8 12.5H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                Contacter le support
            </a>
            <a href="/faq" class="helpful-link">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M10 9C10 8.5 10.5 8 12 8C13.5 8 14 8.5 14 9C14 10.5 12 11 12 12.5V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="16" r="0.5" fill="currentColor" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                FAQ
            </a>
            <a href="/status" class="helpful-link">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M12 8V12L14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                État du service
            </a>
        </div>
    </div>

</div>

</body>
</html>
