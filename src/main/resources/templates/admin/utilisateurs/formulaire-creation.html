<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvel utilisateur</title>
    <link rel="stylesheet" th:href="@{/css/formulairesUsers.css}">
</head>
<body>
<!--MESSAGES SPRING DU CONTROLLER-->
<div id="toast-success" class="toast toast-succes" th:if="${succes}">
    <i class='bx bx-check-circle'></i>
    <span th:text="${succes}"></span>
    <button type="button" onclick="this.parentElement.remove()" class="toast-close">&times;</button>
</div>
<div id="toast-erreur" class="toast toast-erreur" th:if="${erreur}">
    <i class='bx bx-error-circle'></i>
    <span th:text="${erreur}"></span>
</div>
<!--MESSAGES SPRING DU CONTROLLER-->

<div class="page-header"><h2>Ajouter Nouvel Administrateur</h2></div>

<div class="card form-card">
    <p th:if="${erreur}" th:text="${erreur}" style="color:red"></p>

    <form th:action="@{/dashboard/utilisateurs/nouveau}" th:object="${userCreateDTO}" method="post">

        <div class="form-group"><label>Nom</label><input type="text" th:field="*{nom}" required /></div>
        <div class="form-group"><label>Prenom</label><input type="text" th:field="*{prenom}" required /></div>
        <div class="form-group"><label>Telephone</label><input type="text" th:field="*{telephone}" required /></div>
        <div class="form-group"><label>Email</label><input type="email" th:field="*{email}" required /></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" th:field="*{motDePasse}" required /></div>

        <div class="form-group">
            <label>Role</label>
            <select th:field="*{roleId}" required>
                <option value="">-- Choisir un role --</option>
                <option th:each="role : ${rolesAdministratifs}" th:value="${role.id}" th:text="${role.intitule}"></option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a th:href="@{/dashboard/utilisateurs}" class="btn btn-outline">Annuler</a>
        </div>
    </form>
</div>

</body>
</html>
