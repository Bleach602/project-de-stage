
<!-- ============================================================
       ONGLET PAIEMENT (fragment : fragments/paiement)
       ============================================================ -->
<div id="paiementTab" class="tab-content" th:fragment="paiement">
    <div class="card">
        <h4><i class="fas fa-credit-card"></i> Effectuer un paiement</h4>
        <form id="paiementForm" th:action="@{/Paiement/pay}"
              th:object="${payment}"
              method="post" >
            <div class="form-group">
                <label><i class="fas fa-money-bill-wave"></i> Montant (FCFA) *</label>
                <input type="number"
                       th:field="*{amount}"
                       name="amount"
                       min="10"
                       placeholder="Ex: 35000" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone-alt"></i> Opérateur *</label>
                <select  th:field="*{operator}"
                        name="operator" required>
                    <option value="">-- Sélectionnez --</option>
                    <option value="ORANGE">Orange</option>
                    <option value="MTN">MTN</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-mobile-alt"></i> Numéro Mobile Money *</label>
                <input type="tel" name="numeroTelephone"  th:field="*{phoneNumber}" placeholder="6XX XXX XXX" required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary"><i class="fas fa-check-circle"></i> Valider le paiement</button>


                    <a class="btn btn-success"
                       th:if="${paiement != null
        and paiement.status.name() == 'SUCCESS'
        and paiement.recu != null}"
                       th:href="@{/candidat/recu/{id}(id=${paiement.recu.id})}">

                        <i class="fas fa-download"></i>
                        Télécharger mon reçu

                    </a>



            </div>
        </form>
    </div>
</div>
