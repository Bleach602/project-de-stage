
<aside class="sidebar" id="sidebar" th:fragment="sidebar">


    <header class="sidebar-header">
        <div class="brand">
            <div class="brand-visual">
                <img src="/img/logo.jpg"
                     alt="Logo IFP-PERLE D'OR - Les Perles d'Or"
                     loading="eager"
                     class="brand-logo-img"
                     th:src="@{/img/logo.jpg}">
                <div class="brand-visual-overlay"></div>
                <div class="brand-icon" aria-hidden="true">
                    <span class="brand-icon-text">✦</span>
                </div>
            </div>
            <div class="brand-content">
                <h1>IFP-PERLE <span>D'OR</span></h1>
                <p>Espace candidat</p>
            </div>
        </div>
        <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Fermer le menu">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
    </header>


    <!-- ========================================================
         PROFIL CANDIDAT (inchangé)
         ======================================================== -->
    <section class="candidate-card">
        <div class="candidate-avatar-wrapper">
            <div class="candidate-avatar">
                <span th:text="${#strings.substring(Candidat.nom, 0, 1)} + ${#strings.substring(Candidat.prenom, 0, 1)}">IFP</span>
            </div>
            <span class="candidate-status" aria-label="Compte actif"></span>
        </div>
        <div class="candidate-information">
            <strong class="candidate-name" th:text="${Candidat.nom + ' ' + Candidat.prenom}">IFP</strong>
            <span class="candidate-role">Candidat</span>
        </div>
        <span class="candidate-menu-indicator">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 10L12 14L16 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
    </section>


    <!-- ========================================================
         NAVIGATION
         ======================================================== -->
    <nav class="sidebar-nav" aria-label="Navigation candidat">
        <div class="nav-container">

            <!-- SECTION 1 : Mon espace -->
            <div class="nav-section">
                <span class="nav-section-title">Mon espace</span>
                <ul>
                    <!-- PROFIL -->
                    <li>
                        <a href="#" data-tab="profil" class="active">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                                    <path d="M5 20C5.7 16.8 8.2 14.8 12 14.8C15.8 14.8 18.3 16.8 19 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="nav-text">Mon profil</span>
                            <span class="nav-arrow">
                                <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </a>
                    </li>

                    <!-- FICHE -->
                    <li>
                        <a title="Commencer par ici ! Cliquer pour créer votre fiche." href="#" data-tab="fiche">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M6 3.5H14L18 7.5V20.5H6V3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                    <path d="M14 3.5V7.5H18" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                    <path d="M9 11H15M9 14.5H15M9 18H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span th:if="${ficheExiste}" class="nav-text">
                                Ma fiche
                            </span>
                            <span th:unless="${ficheExiste}" class="nav-text">
                                <i class="fas fa-file-circle-plus"></i> Commencer mon inscription
                            </span>
                            <span class="nav-arrow">
                                <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </a>
                    </li>

                    <!-- CANDIDATER -->
                    <li th:if="${ficheExiste}">
                        <a title="Pièces obligatoires : CNI, Acte de naissance, Diplôme" href="#" data-tab="candidater">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M5 19L6.2 14.2L15.8 4.6C16.6 3.8 17.9 3.8 18.7 4.6L19.4 5.3C20.2 6.1 20.2 7.4 19.4 8.2L9.8 17.8L5 19Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                                    <path d="M14.2 6.2L17.8 9.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                    <path d="M5 19L9.8 17.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="nav-text">Déposer mes pièces</span>
                            <span class="nav-badge">Nouveau</span>
                            <span class="nav-arrow">
                                <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </a>
                    </li>

                    <!-- DOCUMENTS -->
                    <li>
                        <a href="#" data-tab="documents">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M4 7.5C4 6.4 4.9 5.5 6 5.5H10L12 8H18C19.1 8 20 8.9 20 10V17C20 18.1 19.1 19 18 19H6C4.9 19 4 18.1 4 17V7.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                    <path d="M4 9H20" stroke="currentColor" stroke-width="1.8"/>
                                </svg>
                            </span>
                            <span class="nav-text">Mes documents</span>
                            <span class="nav-arrow">
                                <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- SECTION 2 : Communication -->
            <div class="nav-section">
                <span class="nav-section-title">Communication</span>
                <ul>
                    <!-- NOTIFICATIONS -->
                    <li>
                        <a href="#" data-tab="notifications" class="nav-with-badge">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M18 9C18 5.7 15.8 3.5 12 3.5C8.2 3.5 6 5.7 6 9C6 14 4 15 4 16.5H20C20 15 18 14 18 9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                    <path d="M10 20C10.5 20.7 11.2 21 12 21C12.8 21 13.5 20.7 14 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="nav-text">Notifications</span>
                            <span class="notification-count" th:if="${nombreNotifications > 0}" th:text="${nombreNotifications}">3</span>
                            <span class="nav-arrow">
                                <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </a>
                    </li>

                    <!-- CONTACT -->
                    <li>
                        <a href="#" data-tab="contact">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M4 6.5C4 5.4 4.9 4.5 6 4.5H18C19.1 4.5 20 5.4 20 6.5V15.5C20 16.6 19.1 17.5 18 17.5H12L8 20V17.5H6C4.9 17.5 4 16.6 4 15.5V6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                    <path d="M8 9H16M8 12.5H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="nav-text">Contacter l'administration</span>
                            <span class="nav-arrow">
                                <svg viewBox="0 0 24 24" fill="none"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </span>
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>


    <!-- ========================================================
         BOUTON DÉCONNEXION + FOOTER
         ======================================================== -->
    <div class="sidebar-bottom-block">

        <!-- BOUTON DÉCONNEXION -->
        <div class="logout-hero">
            <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button type="submit" class="logout-btn-hero">
                    <span class="logout-icon-hero">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M10 5H6.5C5.4 5 4.5 5.9 4.5 7V17C4.5 18.1 5.4 19 6.5 19H10"
                                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <path d="M13 8L17 12L13 16"
                                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 12H17"
                                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span class="logout-text-hero">Déconnexion</span>
                    <span class="logout-arrow-hero">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </button>
            </form>
        </div>

        <!-- FOOTER -->
        <footer class="sidebar-footer">
            <div class="footer-brand">
                <span class="footer-dot"></span>
                <span>IFP-PERLE D'OR</span>
            </div>
            <span class="footer-version">v2.3</span>
        </footer>

    </div>

</aside>
