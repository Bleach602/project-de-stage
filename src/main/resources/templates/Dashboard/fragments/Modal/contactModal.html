
<!-- ============================================================
MODALE : CONTACT ADMIN
============================================================ -->
<div class="modal-overlay" id="contactModal" th:fragment="ContactModal">
  <div class="modal-content">
    <button class="close-modal" id="closeContactModal">&times;</button>
    <h4><i class="fas fa-envelope"></i> Envoyer un message</h4>
    <form th:action="@{/candidat/contact-whatsapp}" method="post">

      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}"
      >


      <div class="form-group">
        <label><i class="fas fa-user"></i> Votre nom</label>

        <input type="text"
               th:value="${Candidat.nom + ' ' + Candidat.prenom}"
               disabled style="background: var(--gris-clair);">

      </div>
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email</label>

        <input type="email"

               th:value="${Candidat.email}"

               disabled style="background: var(--gris-clair);">


      </div>
      <div class="form-group">
        <label><i class="fas fa-tag"></i> Sujet *</label>
        <select name="sujet" required>
          <option value="">-- Sélectionnez --</option>
          <option value="inscription">Inscription</option>
          <option value="paiement">Paiement</option>
          <option value="document">Document</option>
          <option value="candidature">Candidature</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-comment"></i> Message *</label>
        <textarea name="message" rows="4" placeholder="Votre demande..." required></textarea>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-outline" id="cancelContactModal">Annuler</button>
        </button>
        <button type="submit" class="btn btn-primary"> <i class="fab fa-whatsapp"></i> Envoyer</button>
      </div>
    </form>
  </div>
</div>
